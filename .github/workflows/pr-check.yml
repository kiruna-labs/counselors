# The fast check branch protection requires on main (KIR-1058, SOC 2 "Automated checks enabled").
# Typecheck, lint (biome), build (tsup) and the unit tests on Linux / Node 22; ci.yml keeps the full OS x Node matrix.
# Runs on every pull request, with no path filter, so the required status check always reports.
name: pr-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    name: pr-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: install
        run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
      - name: unit tests
        run: npm run test -- tests/unit
